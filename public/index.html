<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="landing-page">

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-wallet"></i>
                FinTrack
            </a>

            <div>
                <a href="login.html" class="btn btn-outline-light me-2">
                    Login
                </a>

                <a href="register.html" class="btn btn-light">
                    Get Started
                </a>
            </div>

        </div>
    </nav>


    <section class="hero">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <span class="hero-badge">
                        <i class="fa-solid fa-sparkles"></i>
                        Smart Personal Finance
                    </span>

                    <h1>
                        Take control of
                        <span>your money.</span>
                    </h1>

                    <p>
                        Track your income, expenses, savings and budgets
                        in one beautiful and simple dashboard.
                    </p>

                    <div class="hero-buttons">

                        <a href="register.html" class="btn btn-primary btn-lg">
                            Start Tracking
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>

                        <a href="login.html" class="btn btn-outline-light btn-lg">
                            Sign In
                        </a>

                    </div>

                </div>

                <div class="col-lg-6">

                    <div class="finance-preview">

                        <div class="preview-header">
                            <span>Financial Overview</span>
                            <i class="fa-solid fa-ellipsis"></i>
                        </div>

                        <div class="preview-balance">
                            <small>Total Balance</small>
                            <h2>₹84,250</h2>
                            <span>
                                <i class="fa-solid fa-arrow-trend-up"></i>
                                +12.5% this month
                            </span>
                        </div>

                        <div class="preview-cards">

                            <div>
                                <i class="fa-solid fa-arrow-down"></i>
                                <small>Income</small>
                                <strong>₹1,20,000</strong>
                            </div>

                            <div>
                                <i class="fa-solid fa-arrow-up"></i>
                                <small>Expenses</small>
                                <strong>₹35,750</strong>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</div>

</body>
</html>
